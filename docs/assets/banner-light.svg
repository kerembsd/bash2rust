<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="900" height="180" role="img" aria-label="bash2rust: Deterministic Bash-to-Rust Compiler and Synchronous Runtime">
  <rect x="1" y="1" width="898" height="178" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Subtle engineering accent rule -->
  <rect x="48" y="42" width="3" height="96" rx="1.5" fill="#d0d7de"/>

  <!-- Terminal prompt badge -->
  <rect x="68" y="54" width="66" height="54" rx="8" fill="#f6f8fa" stroke="#2b8a3e" stroke-width="1.5"/>
  <text x="101" y="88" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#2b8a3e">$_</text>

  <!-- Compiler arrow motif -->
  <path d="M148 81 H170 M164 74 L172 81 L164 88" fill="none" stroke="#57606a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Rust gear motif -->
  <g transform="translate(206, 81)">
    <path d="M-3,-23 L3,-23 L5,-18 A18,18 0 0,1 10,-16 L14,-19 L19,-14 L16,-10 A18,18 0 0,1 18,-5 L23,-3 L23,3 L18,5 A18,18 0 0,1 16,10 L19,14 L14,19 L10,16 A18,18 0 0,1 5,18 L3,23 L-3,23 L-5,18 A18,18 0 0,1 -10,16 L-14,19 L-19,14 L-16,10 A18,18 0 0,1 -18,5 L-23,3 L-23,-3 L-18,-5 A18,18 0 0,1 -16,-10 L-19,-14 L-14,-19 L-10,-16 A18,18 0 0,1 -5,-18 Z" fill="none" stroke="#d9480f" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="9" fill="none" stroke="#d9480f" stroke-width="2"/>
    <circle cx="0" cy="0" r="3" fill="#d9480f"/>
  </g>

  <!-- Wordmark and subtitle -->
  <text x="256" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="40" font-weight="700" letter-spacing="-0.5" fill="#1f2328">bash<tspan fill="#d9480f">2</tspan>rust</text>
  <text x="256" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" font-weight="400" fill="#57606a">Deterministic Bash-to-Rust Compiler &amp; Synchronous Runtime</text>
</svg>
