name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-release-

      - name: Build release binary
        run: cargo build --release -p bash2rust-cli --target ${{ matrix.target }}

      - name: Package release archive and checksum
        run: |
          STAGE_DIR="bash2rust-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$STAGE_DIR"
          cp "target/${{ matrix.target }}/release/bash2rust" "$STAGE_DIR/"
          cp LICENSE-MIT LICENSE-APACHE README.md "$STAGE_DIR/"
          tar -czf "${STAGE_DIR}.tar.gz" "$STAGE_DIR"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${STAGE_DIR}.tar.gz" > "${STAGE_DIR}.tar.gz.sha256"
          else
            shasum -a 256 "${STAGE_DIR}.tar.gz" > "${STAGE_DIR}.tar.gz.sha256"
          fi

      - name: Upload release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bash2rust-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            bash2rust-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256
