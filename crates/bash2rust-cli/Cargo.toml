[package]
name = "bash2rust-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Command-line interface and Cargo project migrator for bash2rust"
keywords = ["bash", "rust", "cli", "transpiler"]
categories = ["command-line-utilities", "compilers"]

[[bin]]
name = "bash2rust"
path = "src/main.rs"

[dependencies]
bash2rust-ai.workspace = true
bash2rust-core.workspace = true
bash2rust-runtime.workspace = true
bash2rust-verify.workspace = true
anyhow.workspace = true
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
clap.workspace = true
serde_json.workspace = true
